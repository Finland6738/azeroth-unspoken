name: Docs rule

# A pull request that changes the addon must also update CHANGELOG.md and the documentation, unless it has the
# label `no-docs-needed`. The rule is in tools/check_pr_docs.py. The job name "Docs rule" is a required status check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs rule
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Files and labels are read from the API (not from the event payload), so that a re-run sees the current labels.
      - name: List the changed files and the labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' > "$RUNNER_TEMP/labels.txt"
          echo "Changed files: $(wc -l < "$RUNNER_TEMP/changed.txt"); labels: $(paste -sd, "$RUNNER_TEMP/labels.txt")"

      - name: Check CHANGELOG and documentation
        run: |
          set +e
          python -I -X utf8 tools/check_pr_docs.py --files "$RUNNER_TEMP/changed.txt" --labels "$RUNNER_TEMP/labels.txt" | tee "$RUNNER_TEMP/result.txt"
          status=${PIPESTATUS[0]}
          {
            echo "### Docs rule"
            echo
            echo '```'
            cat "$RUNNER_TEMP/result.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=CHANGELOG or docs missing::This PR changes the addon without updating CHANGELOG.md and the docs. See the job summary for what to update, or add the label no-docs-needed."
          fi
          exit "$status"
