name: CI

# Offline tests (Lua 5.1 through lupa) on every pull request and on every push to main.
# The job name "Tests" is the status check required by the branch protection of main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install lupa
        run: python -m pip install lupa==2.8

      # The public API dump is consulted by Tests/check_api.py and is never copied into the repository: it is
      # cloned into the runner's temporary folder, outside the workspace, and passed with AU_API_JSON.
      - name: Fetch the Forever API dump (runner only)
        run: |
          git clone --depth 1 https://github.com/Atraeau/WoW-Addons "$RUNNER_TEMP/WoW-Addons"
          test -f "$RUNNER_TEMP/WoW-Addons/docs/api.json"
          echo "AU_API_JSON=$RUNNER_TEMP/WoW-Addons/docs/api.json" >> "$GITHUB_ENV"

      # Runs the whole suite: addon tests, the content counts, check_api.py, the docs checks (examples, relative
      # links, wiki links, privacy). AU_REQUIRE_API makes a missing API dump a failure instead of a skipped check.
      - name: Run the tests
        env:
          AU_REQUIRE_API: "1"
        run: python -I -X utf8 Tests/run_tests.py AzerothUnspoken
